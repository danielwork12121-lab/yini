[project]
name = "corner-backend"
version = "0.1.0"
description = "Corner backend: diary storage, nightly two-sided analysis agent, REST + SSE API"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "google-genai>=1.0",
    "PyJWT[crypto]>=2.9",
    "httpx>=0.27",
    "apscheduler>=3.10,<4",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
