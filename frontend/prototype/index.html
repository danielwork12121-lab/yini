/* Layout: one phone-width column, hub-and-spoke. Today is the hub; Log is a focused
   sub-flow; Problems and Compliments are drawers you open, never badges.
   Tokens are the real app's (frontend/src/app/globals.css). Light only, by design:
   the app is a cream canvas with white cards. */
:root {
  --canvas:#FFFCEC; --canvas-sunk:#FAF4E4;
  --surface:#FFFFFF; --surface-warm:#FFF8EC;
  --ink:#2A2520; --ink-muted:#6B6560; --ink-faint:#9A938C;
  --line:#E8DFCE; --line-strong:#D6C9B0;
  --primary:#C56B4B; --primary-press:#9E4A33; --primary-tint:#E0A081;
  --sage:#9CAF88; --butter:#FFD66E; --blush:#FCC9D8;
  --rec:#D63A3A;
  /* illustration only: the pastels never touch buttons, borders or chrome */
  --wall:#FFEFD3; --floor:#F1DDB7; --sky:#CFE5EE; --pot:#E0A081; --outline:#3E2F23;
  --r-md:14px; --r-lg:20px; --r-xl:28px; --r-pill:9999px;
  --sh-md:0 8px 24px rgba(74,60,45,.08);
  --ease:cubic-bezier(.4,0,.2,1);
  --ease-bounce:cubic-bezier(.34,1.56,.64,1);
  --display:Fraunces,Georgia,'Times New Roman',serif;
  --body:Figtree,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
}
* { box-sizing:border-box; }
[hidden] { display:none !important; }
html, body { margin:0; }
body {
  background:var(--canvas); color:var(--ink); font-family:var(--body); font-size:16px;

.phone { max-width:430px; margin:0 auto; min-height:100dvh; padding:36px 4px 128px; }

[tabindex="-1"]:focus { outline:none; }
button { font-family:inherit; }

.display { font-family:var(--display); font-weight:600; letter-spacing:-.5px; font-variation-settings:"SOFT" 50, "WONK" 1; }
.h1 { font-size:28px; line-height:1.2; }
.h2 { font-size:22px; line-height:1.25; letter-spacing:-.3px; }

.caption { font-size:13px; line-height:1.4; color:var(--ink-faint); }
.eyebrow { font-size:13px; line-height:1.4; color:var(--ink-faint); letter-spacing:.06em; text-transform:uppercase; }
.err { color:var(--primary-press); font-size:14px; line-height:1.5; text-align:center; }

.card { background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); padding:24px; }
.card-warm { background:var(--surface-warm); }

/* the one offset-shadow button */
.btn {
  appearance:none; border:none; cursor:pointer; width:100%; min-height:52px;
  border-radius:var(--r-pill); background:var(--primary); color:#fff;
  font-size:16px; font-weight:600; box-shadow:0 4px 0 0 var(--primary-press);

}
.btn:active:not(:disabled) { transform:translateY(2px); box-shadow:0 2px 0 0 var(--primary-press); }
.btn:disabled { opacity:.5; cursor:not-allowed; }
.btn-quiet {
  background:transparent; color:var(--ink-muted); box-shadow:none;
  border:1px solid var(--line-strong); min-height:48px; font-weight:500;
}
.btn-quiet:active:not(:disabled) { transform:none; box-shadow:none; background:var(--canvas-sunk); }
.link {
  background:none; border:none; cursor:pointer; color:var(--ink-muted); font-size:14px;
  text-decoration:underline; text-underline-offset:3px; padding:12px 8px; min-height:44px;
}
.back { display:inline-flex; align-items:center; gap:4px; background:none; border:none; cursor:pointer; color:var(--ink-muted); font-size:15px; min-height:44px; padding:0 8px 0 0; }
.back svg { width:20px; height:20px; }

textarea.entry, input.field {
  width:100%; padding:16px; border:1px solid var(--line); border-radius:var(--r-md);
  background:var(--surface); color:var(--ink); font:inherit; font-size:16px; line-height:1.6;
}
textarea.entry { min-height:140px; resize:vertical; }
input.field { padding:14px 16px; }
textarea.entry:focus, input.field:focus { outline:2px solid var(--primary-tint); outline-offset:1px; }
label.caption { display:block; margin-bottom:8px; }

.mic {
  width:96px; height:96px; border-radius:50%; border:none; cursor:pointer;
  background:var(--primary); color:#fff; display:grid; place-items:center;
  box-shadow:var(--sh-md); transition:transform 150ms var(--ease);
}
.mic[data-recording="true"] { background:var(--rec); animation:pulse 1.6s infinite; }

@keyframes pulse {
  0% { box-shadow:0 0 0 0 rgba(214,58,58,.45); }
  70% { box-shadow:0 0 0 22px rgba(214,58,58,0); }
  100% { box-shadow:0 0 0 0 rgba(214,58,58,0); }
}
.bond-track { height:8px; border-radius:var(--r-pill); background:var(--canvas-sunk); overflow:hidden; }
.bond-fill { height:100%; background:var(--sage); border-radius:var(--r-pill); transition:width 400ms var(--ease); }
.bond-fill.rec { background:var(--rec); transition:none; }

/* audio preview */
.player { display:flex; align-items:center; gap:12px; background:var(--canvas-sunk); border-radius:var(--r-pill); padding:6px 16px 6px 6px; }
.player button { width:44px; height:44px; flex:none; border-radius:50%; border:none; cursor:pointer; background:var(--ink); color:var(--canvas); display:grid; place-items:center; }
.player button svg { width:18px; height:18px; }

.fadein { animation:fadein 360ms var(--ease) backwards; }
@keyframes fadein { from { opacity:0; } to { opacity:1; } }

/* pet + room */
.pet-card { padding:0; overflow:hidden; }
.room-wrap { position:relative; height:210px; }
.room { display:block; width:100%; height:210px; }
.room *, .pet-svg * { vector-effect:non-scaling-stroke; }
.o { stroke:var(--outline); stroke-width:3; stroke-linecap:round; stroke-linejoin:round; }
.pet-slot { position:absolute; left:50%; bottom:20px; width:132px; height:132px; transform:translateX(-50%); background:none; border:none; padding:0; cursor:pointer; border-radius:50%; }
.pet-svg { width:100%; height:100%; display:block; overflow:visible; }
.pet-bob { animation:bob 2.4s ease-in-out infinite alternate; }
.wobble { animation:wobble 520ms var(--ease); }
@keyframes bob { from { transform:translateY(0); } to { transform:translateY(-6px); } }
@keyframes wobble { 0%,100% { transform:rotate(0); } 25% { transform:rotate(-7deg); } 60% { transform:rotate(6deg); } }
.pet-info { padding:18px 24px 24px; }
.heart { position:absolute; width:24px; height:24px; pointer-events:none; animation:floatup 1.1s var(--ease) forwards; z-index:2; }
@keyframes floatup { from { transform:translateY(0); opacity:1; } to { transform:translateY(-84px); opacity:0; } }

/* the one big celebration */
.celebrate { position:fixed; inset:0; z-index:70; background:rgba(255,252,236,.95); display:grid; place-items:center; padding:24px; text-align:center; animation:fadein 240ms var(--ease) backwards; }
.celebrate-in { position:relative; display:flex; flex-direction:column; align-items:center; gap:14px; max-width:340px; }
.burst { position:absolute; top:78px; left:50%; width:170px; height:170px; margin:-85px 0 0 -85px; border-radius:50%; border:3px solid var(--sage); opacity:0; animation:ring 1.5s var(--ease) both; }

.hatch-pop { width:170px; height:170px; position:relative; animation:hatchpop 720ms var(--ease-bounce) backwards; }

.row {
  display:flex; align-items:center; justify-content:space-between; gap:12px; width:100%; min-height:68px;

.empty { display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center; padding:32px 24px; }
.empty svg { width:96px; height:96px; }

.tabbar { position:fixed; left:0; right:0; bottom:0; z-index:30; background:var(--canvas); border-top:1px solid var(--line); padding:6px max(16px, env(safe-area-inset-left, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-right, 0px)); }

    stopPlay(); r.error = ''; r.phase = 'sending'; renderLog($('#app'));
    setTimeout(function () {
      S.reply = mockReply(text); addPending(text);
      var hatched = feed('you'); r.phase = 'reply';
      if (S.route === 'log') renderLog($('#app'));
      if (hatched) celebrate();
    }, 1500);
  }
  function resetRec() { clearInterval(recTimer); stopPlay(); S.rec = fresh().rec; }

  /* ───────── actions ───────── */
  function start(who) {
    S.me = who; S.data = JSON.parse(JSON.stringify(SEED[who]));
    if (S.pair.name.trim() && who === 'avery') S.data.name = S.pair.name.trim();
    go('today');
  }
  var ACT = {
    'get-started': function () { go('create'); },
    'auth-back': function () { go('welcome'); },
    'to-create': function (t, e) { e.preventDefault(); go('create'); },
    'toggle-pw': function (t) {
      var i = $('#' + t.dataset.for); if (!i) return; var show = i.type === 'password';
      i.type = show ? 'text' : 'password'; t.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    },
    'auth-google': function () { if (S.route === 'signin') start('avery'); else go('pair'); },
    'signin-go': function () { start(/^\s*sam/i.test(S.auth.email) ? 'sam' : 'avery'); },
    'pick-lover': function () { S.auth.lover = !S.auth.lover; paintRole(); },
    'create-go': function () {
      if (!S.auth.lover) return toast('Pick who you\u2019re here with first.');
      if (S.auth.user.trim()) S.pair.name = S.auth.user.trim();
      go('pair');
    },
    demo: function (t) { S.demoOpen = false; start(t.dataset.who); },
    go: function (t) { go(t.dataset.to); },
    hello: function () { closeSheet(); if (S.route === 'today' || S.route === 'log') render(); },
    'sheet-close': closeSheet,
    scrim: function (t, e) { if (e.target === t) closeSheet(); },
    'pair-code': function () {
      var c = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789', s = ''; for (var i = 0; i < 6; i++) s += c[Math.floor(Math.random() * c.length)];
      S.pair.invite = s; render();
    },
    'pair-start': function () { start('avery'); },
    'pair-join': function () { start('sam'); },
    copy: function () {
      var code = S.pair.invite;
      try { navigator.clipboard.writeText(code).then(function () { toast('Code copied.'); }, function () { toast('Select the code to copy it.'); }); } catch (e) { toast('Select the code to copy it.'); }
    },
    pet: function () {
      var p = petState(), slot = $('#petslot'), svg = slot && $('svg', slot);
      if (svg && !reduced()) { svg.classList.remove('wobble'); void svg.getBoundingClientRect(); svg.classList.add('wobble'); }
      if (!p.hatched || reduced() || !slot) return;
      var wrap = slot.parentNode;
      [-26, 0, 26].forEach(function (dx, i) {
        setTimeout(function () {
          var h = document.createElement('span'); h.innerHTML = HEART; var s = h.firstChild;
          s.style.left = 'calc(50% + ' + dx + 'px)'; s.style.bottom = (130 + (i % 2) * 14) + 'px'; wrap.appendChild(s);
          setTimeout(function () { s.remove(); }, 1150);
        }, i * 140);
      });
    },
    mic: function () { if (S.rec.recording) recStop(); else recStart(); },
    typing: function () { S.rec.typing = true; renderLog($('#app')); var e = $('#entry'); if (e) e.focus(); },
    play: togglePlay,
    rerecord: function () { resetRec(); renderLog($('#app')); },
    send: send,
    nudge: function (t) {
      var n = S.data.problems.filter(function (x) { return x.id === t.dataset.id; })[0], s = t.dataset.s; if (!n) return;
      if (s === 'done') { if (n.status !== 'done') { S.doneFor = n.id; renderProblems($('#app')); var e = $('#donenote'); if (e) e.focus(); } return; }
      n.status = s; S.doneFor = null; renderProblems($('#app'));
      toast(s === 'set_down' ? 'Set down. No harm in that.' : 'Good. One at a time.');
    },
    'done-cancel': function () { S.doneFor = null; renderProblems($('#app')); },
    'done-save': function (t) {
      var note = ($('#donenote') || {}).value || '';
      if (!note.trim()) { $('#donenote').focus(); return toast('A line about what you did, then save.'); }
      var n = S.data.problems.filter(function (x) { return x.id === t.dataset.id; })[0];
      n.status = 'done'; S.notes[n.id] = note.trim(); S.doneFor = null; renderProblems($('#app')); toast('Done. ' + S.petName + ' noticed.');
    },
    coach: function (t) { coachSheet(t.dataset.id); },
    'chat-send': function (t) {
      var i = $('#chatin'), v = i.value.trim(), id = t.dataset.id; if (!v) return;
      S.chat[id].push({ role:'user', body:v }); i.value = ''; paintChat(id);
      setTimeout(function () { S.chat[id].push({ role:'coach', body:COACH[(S.chat[id].length / 2 - .5) % COACH.length | 0] }); paintChat(id); }, 700);
    },
    quest: function () {
      var v = ($('#questin') || {}).value || ''; if (!v.trim()) return;
      S.questDone = true; renderCompliments($('#app')); toast('Banked for ' + S.data.partner + '.');
    },
    'd-partner': function () { var h = feed('partner'); if (h) celebrate(); else toast(S.data.partner + ' checked in.'); render(); },
    'd-day': function () {
      S.youFed = false; S.partnerFed = false; S.reply = null; S.questDone = false; S.dayOffset += 1; resetRec(); toast('A new day.'); render();
    },
    'd-empty': function () { S.drawersEmpty = !S.drawersEmpty; render(); },
    'd-switch': function () {
      var other = S.me === 'avery' ? 'sam' : 'avery', keep = { half:S.half, hatched:S.hatched, dayOffset:S.dayOffset };
      var you = S.partnerFed, partner = S.youFed;
      S.me = other; S.data = JSON.parse(JSON.stringify(SEED[other])); S.youFed = you; S.partnerFed = partner;
      S.reply = null; S.questDone = false; S.chat = {}; S.notes = {}; resetRec(); S.demoOpen = false; go('today'); toast('Now ' + S.data.name + '.');
    },
    'd-reset': function () { resetRec(); S = fresh(); closeSheet(); $('#demo-panel').hidden = true; go('welcome'); render(true); }
  };

  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act]');
    if (t && ACT[t.dataset.act]) { if (S.demoOpen && t.closest('#demo-panel')) S.demoOpen = false; ACT[t.dataset.act](t, e); if (!S.demoOpen) demoChrome(); return; }
    if (e.target.closest('#demo-btn')) { S.demoOpen = !S.demoOpen; demoChrome(); return; }
    if (S.demoOpen && !e.target.closest('#demo-panel')) { S.demoOpen = false; demoChrome(); }
  });
  document.addEventListener('input', function (e) {
    var t = e.target;
    if (t.id === 'si-email') S.auth.email = t.value; if (t.id === 'si-pw') S.auth.pw = t.value;
    if (t.id === 'ca-user') S.auth.user = t.value; if (t.id === 'ca-pw') S.auth.pw2 = t.value;
    if (t.id === 'entry') { S.rec.text = t.value; var b = $('#sendbtn'); if (b && S.rec.phase === 'capture') b.disabled = !t.value.trim(); }
    if (t.id === 'pn') { S.pair.name = t.value; var g = $('#getcode'), j = $('#joinbtn'); if (g) g.disabled = !t.value.trim(); if (j) j.disabled = !(S.pair.join.length === 6 && t.value.trim()); }
    if (t.id === 'pj') { t.value = t.value.toUpperCase(); S.pair.join = t.value; var j2 = $('#joinbtn'); if (j2) j2.disabled = !(t.value.length === 6 && S.pair.name.trim()); }
    if (t.id === 'questin') { var q = $('#questbtn'); if (q) q.disabled = !t.value.trim(); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { if ($('#layer').firstChild && !$('.celebrate')) closeSheet(); if (S.demoOpen) { S.demoOpen = false; demoChrome(); } }
    if (e.key === 'Enter' && e.target.id === 'chatin') { var b = $('[data-act="chat-send"]'); if (b) b.click(); }
    if (e.key === 'Enter' && e.target.id === 'questin') { var q = $('#questbtn'); if (q && !q.disabled) q.click(); }
  });
  window.addEventListener('hashchange', function () { render(); });
  window.addEventListener('resize', fitArt);
  render(true);
})();
</script>

</html>
